name: NuGet MediaPortal.libbluray

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['package/nuget/**', 'docs/RELEASE-NOTES.md', 'docs/ATTRIBUTION.md', '.github/workflows/nuget.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install meson ninja

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: freetype (static)
        shell: pwsh
        run: |
          choco install pkgconfiglite -y --no-progress
          $triplet = '${{ matrix.arch }}-windows-static-md'
          vcpkg install "freetype:$triplet" --x-install-root="$env:RUNNER_TEMP\vcpkg"
          "PKG_CONFIG_PATH=$env:RUNNER_TEMP\vcpkg\$triplet\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: |
          meson setup build -Dbuildtype=release -Ddefault_library=shared -Dbdj_jar=enabled "-Djdk_home=$env:JAVA_HOME" -Dfontconfig=disabled -Dfreetype=enabled -Dlibxml2=disabled
          meson compile -C build

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.arch }}
          path: |
            build/src/bluray-*.dll
            build/src/libbluray/bluray-version.h
            build/src/libbluray/bdj/libbluray-*.jar

  pack:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Pack
        shell: pwsh
        run: |
          $isTag = $env:GITHUB_REF_TYPE -eq 'tag'
          $version = if ($isTag) { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-ci.$env:GITHUB_RUN_NUMBER" }
          .\package\nuget\pack.ps1 -X64Build artifacts\build-x64 -X86Build artifacts\build-x86 -Version $version -Out nupkg -RequireNotes:$isTag
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            nupkg/*.nupkg
            nupkg/release-notes.md

  publish:
    if: github.ref_type == 'tag'
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" *.nupkg --repo "$GITHUB_REPOSITORY" --title "MediaPortal.libbluray ${GITHUB_REF_NAME#v}" --notes-file release-notes.md             || gh release upload "$GITHUB_REF_NAME" *.nupkg --repo "$GITHUB_REPOSITORY" --clobber
